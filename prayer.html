<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Request Prayer | MAKOM</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="prayer-page">

  <main class="prayer-page-wrap">

    <div class="prayer-page-inner">

      <p class="prayer-eyebrow">
        MAKOM • PRAYER
      </p>

      <h1>
        YOU DON'T HAVE TO<br>
        CARRY IT <span>ALONE.</span>
      </h1>

      <p class="prayer-intro">
        Whatever you're walking through, you can bring it before God.
        Share your prayer request below, and the MAKOM prayer team
        will stand with you in prayer.
      </p>

      <form
        class="prayer-form"
        action="https://formspree.io/f/myezppaw"
        method="POST"
      >

        <div class="prayer-field">
          <label for="name">NAME <span>(OPTIONAL)</span></label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
          >
        </div>

        <div class="prayer-field">
          <label for="email">EMAIL <span>(OPTIONAL)</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Your email"
          >
        </div>

        <div class="prayer-field prayer-field-full">
          <label for="request">HOW CAN WE PRAY WITH YOU?</label>
          <textarea
            id="request"
            name="prayer_request"
            rows="7"
            placeholder="Share your prayer request..."
            required
          ></textarea>
        </div>

        <input
          type="hidden"
          name="_subject"
          value="New MAKOM Prayer Request"
        >

        <button type="submit" class="prayer-submit">
          SEND PRAYER REQUEST →
        </button>

      </form>

      <p class="prayer-privacy">
        Your prayer request will be treated with care and respect.
      </p>

      <a href="index.html" class="prayer-return">
        ← RETURN TO MAKOM
      </a>

    </div>

  </main>

</body>
</html>
